<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description | strip }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<main>
  <header>
    <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
    <p class="tagline">{{ site.tagline }}</p>
    <p class="meta">
      <strong>{{ site.workshop_date }}</strong> · {{ site.location }} ·
      <span class="nowrap">co-located with <a href="{{ site.etaps.url }}">{{ site.etaps.name }}</a></span>
    </p>
  </header>

  {{ content }}

  <footer>
    {{ site.title }} is a satellite workshop of
    <a href="{{ site.etaps.url }}">{{ site.etaps.name }}</a>.
  </footer>
</main>
</body>
</html>
